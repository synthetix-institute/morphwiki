<svg width="1200" height="675" viewBox="0 0 1200 675" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">MorphWiki scientific mechanism constructor</title>
  <desc id="desc">Source topics and equations are organized into an operation-carrier identity, completed by closure, an observable map, protocol and physical realization, then edited through six discovery operations.</desc>
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#14231D" flood-opacity="0.10"/>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10Z" fill="#4B6359"/>
    </marker>
  </defs>

  <rect width="1200" height="675" fill="#FFFFFF"/>
  <rect x="42" y="42" width="1116" height="591" rx="8" fill="#F7F9F7" stroke="#D7DFDA"/>

  <text x="78" y="103" fill="#14231D" font-family="Inter, Arial, sans-serif" font-size="42" font-weight="750">MorphWiki</text>
  <text x="78" y="140" fill="#4B6359" font-family="Inter, Arial, sans-serif" font-size="22" font-weight="600">Scientific fields by mechanism</text>
  <text x="78" y="170" fill="#65756E" font-family="Inter, Arial, sans-serif" font-size="16">Named knowledge remains searchable; operational identity determines the map.</text>

  <g filter="url(#shadow)">
    <rect x="76" y="218" width="250" height="318" rx="6" fill="#FFFFFF" stroke="#CAD5CF"/>
    <text x="98" y="250" fill="#29483B" font-family="Inter, Arial, sans-serif" font-size="15" font-weight="700">TOPICS AND EVIDENCE</text>
    <rect x="98" y="278" width="206" height="52" rx="4" fill="#EDF3F0"/>
    <text x="112" y="300" fill="#29483B" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="650">Named topics</text>
    <text x="112" y="319" fill="#65756E" font-family="Inter, Arial, sans-serif" font-size="13">particles, fields, measurement</text>
    <rect x="98" y="344" width="206" height="52" rx="4" fill="#EEF2F8"/>
    <text x="112" y="366" fill="#314D70" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="650">Source equations</text>
    <text x="112" y="385" fill="#65756E" font-family="Inter, Arial, sans-serif" font-size="13">domains, assumptions, derivations</text>
    <rect x="98" y="410" width="206" height="52" rx="4" fill="#F8F2E8"/>
    <text x="112" y="432" fill="#755A2E" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="650">Provenance</text>
    <text x="112" y="451" fill="#65756E" font-family="Inter, Arial, sans-serif" font-size="13">papers, citations, history</text>
    <text x="98" y="495" fill="#65756E" font-family="Inter, Arial, sans-serif" font-size="13">Retained as realization and evidence,</text>
    <text x="98" y="515" fill="#65756E" font-family="Inter, Arial, sans-serif" font-size="13">not discarded from the field.</text>
  </g>

  <path d="M342 378H392" stroke="#4B6359" stroke-width="2.5" marker-end="url(#arrow)"/>
  <text x="344" y="361" fill="#4B6359" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="650">factor</text>

  <g filter="url(#shadow)">
    <rect x="402" y="205" width="394" height="353" rx="6" fill="#FFFFFF" stroke="#CAD5CF"/>
    <text x="426" y="237" fill="#29483B" font-family="Inter, Arial, sans-serif" font-size="15" font-weight="700">OPERATIONAL IDENTITY</text>

    <rect x="430" y="264" width="132" height="54" rx="5" fill="#DCE8F8" stroke="#A8BFDF"/>
    <text x="496" y="286" text-anchor="middle" fill="#244B7C" font-family="Georgia, serif" font-size="19" font-weight="700">Omega</text>
    <text x="496" y="306" text-anchor="middle" fill="#55708F" font-family="Inter, Arial, sans-serif" font-size="12">operation</text>
    <rect x="636" y="264" width="132" height="54" rx="5" fill="#DDEFE4" stroke="#A8CEB7"/>
    <text x="702" y="286" text-anchor="middle" fill="#2D6241" font-family="Georgia, serif" font-size="19" font-weight="700">Xi</text>
    <text x="702" y="306" text-anchor="middle" fill="#587764" font-family="Inter, Arial, sans-serif" font-size="12">carrier</text>

    <path d="M496 319L566 349" stroke="#6D8178" stroke-width="2" marker-end="url(#arrow)"/>
    <path d="M702 319L632 349" stroke="#6D8178" stroke-width="2" marker-end="url(#arrow)"/>
    <rect x="532" y="346" width="134" height="45" rx="5" fill="#E8ECEA" stroke="#BBC6C0"/>
    <text x="599" y="374" text-anchor="middle" fill="#263E34" font-family="Georgia, serif" font-size="17" font-weight="700">M = (Omega, Xi)</text>

    <rect x="442" y="415" width="78" height="42" rx="5" fill="#FAEDB8" stroke="#DCCB81"/>
    <rect x="560" y="415" width="78" height="42" rx="5" fill="#F4D9B8" stroke="#D9B47F"/>
    <rect x="678" y="415" width="78" height="42" rx="5" fill="#F3D5D8" stroke="#D7A7AD"/>
    <text x="481" y="441" text-anchor="middle" fill="#675516" font-family="Georgia, serif" font-size="18" font-weight="700">C</text>
    <text x="599" y="441" text-anchor="middle" fill="#745025" font-family="Georgia, serif" font-size="18" font-weight="700">R</text>
    <text x="717" y="441" text-anchor="middle" fill="#7B4047" font-family="Georgia, serif" font-size="18" font-weight="700">P</text>
    <path d="M599 392V411" stroke="#6D8178" stroke-width="2" marker-end="url(#arrow)"/>

    <rect x="475" y="480" width="248" height="43" rx="5" fill="#E9E2F5" stroke="#BDB0D7"/>
    <text x="599" y="507" text-anchor="middle" fill="#4F406B" font-family="Georgia, serif" font-size="16" font-weight="700">I_op = (M; C, R, P)</text>
    <path d="M481 458L548 478" stroke="#6D8178" stroke-width="1.8"/>
    <path d="M599 458V478" stroke="#6D8178" stroke-width="1.8"/>
    <path d="M717 458L650 478" stroke="#6D8178" stroke-width="1.8"/>

    <rect x="430" y="537" width="338" height="1" fill="#D8DFDB"/>
    <text x="599" y="548" text-anchor="middle" fill="#65756E" font-family="Inter, Arial, sans-serif" font-size="12">+ A: objects, parameters, boundaries, apparatus</text>
  </g>

  <path d="M812 378H858" stroke="#4B6359" stroke-width="2.5" marker-end="url(#arrow)"/>
  <text x="813" y="361" fill="#4B6359" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="650">construct</text>

  <g filter="url(#shadow)">
    <rect x="868" y="218" width="254" height="318" rx="6" fill="#FFFFFF" stroke="#CAD5CF"/>
    <text x="890" y="250" fill="#29483B" font-family="Inter, Arial, sans-serif" font-size="15" font-weight="700">DISCOVERY OPERATIONS</text>
    <text x="890" y="283" fill="#244B7C" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="650">Complete</text>
    <text x="1000" y="283" fill="#2D6241" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="650">Reattach</text>
    <text x="890" y="322" fill="#755A2E" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="650">Compose</text>
    <text x="1000" y="322" fill="#6A477B" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="650">Deform</text>
    <text x="890" y="361" fill="#7B4047" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="650">Observe</text>
    <text x="1000" y="361" fill="#405F59" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="650">Revise</text>

    <path d="M895 395H1092" stroke="#B9C5BF" stroke-width="1.5"/>
    <text x="890" y="427" fill="#29483B" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="700">retain Q, edit B</text>
    <path d="M890 443H1072" stroke="#4B6359" stroke-width="2" marker-end="url(#arrow)"/>
    <text x="890" y="475" fill="#29483B" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="700">derive a consequence</text>
    <path d="M890 491H1072" stroke="#4B6359" stroke-width="2" marker-end="url(#arrow)"/>
    <text x="890" y="519" fill="#65756E" font-family="Inter, Arial, sans-serif" font-size="12">accept or revise the named clause</text>
  </g>

  <line x1="76" y1="584" x2="1122" y2="584" stroke="#D7DFDA"/>
  <text x="76" y="614" fill="#29483B" font-family="Inter, Arial, sans-serif" font-size="17" font-weight="700">Mechanism-first, source-grounded, consequence-driven.</text>
  <text x="523" y="614" fill="#65756E" font-family="Inter, Arial, sans-serif" font-size="16">A connection states what survives and what can fail.</text>
</svg>
